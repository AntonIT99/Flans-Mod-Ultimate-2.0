import org.gradle.api.internal.file.collections.DefaultConfigurableFileCollection

import javax.crypto.Cipher
import javax.crypto.spec.GCMParameterSpec
import javax.crypto.spec.SecretKeySpec
import java.nio.charset.StandardCharsets
import java.nio.file.Files
import java.security.MessageDigest

plugins {
    id 'java-library'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.143'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "[$minecraft_version] $mod_name"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// NeoForge metadata file expanded in every mod source set.
def modsTomlPath = 'META-INF/neoforge.mods.toml'

// Typed values for the run blocks, where 'project' and properties resolve against RunModel.
String mainModId = mod_id
File dataRunDirectory = file('run-data')
// runData output is only for inspection; it is not packaged.
String dataOutputPath = layout.buildDirectory.dir('datagen').get().asFile.absolutePath
String mainResourcesPath = file('src/main/resources/').absolutePath

neoForge {
    version = neo_version

    parchment {
        mappingsVersion = parchment_mappings_version
        minecraftVersion = parchment_minecraft_version
    }

    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
            // Force colored log levels, also in IDE consoles.
            systemProperty 'terminal.ansi', 'true'
            systemProperty 'terminal.keepMinecraftFormatting', 'true'
        }

        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', mainModId
        }

        clientDebug {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', mainModId
            logLevel = org.slf4j.event.Level.DEBUG
        }

        server {
            server()
            systemProperty 'neoforge.enabledGameTestNamespaces', mainModId
            programArgument '--nogui'
        }

        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', mainModId
        }

        data {
            data()
            gameDirectory = dataRunDirectory
            programArguments.addAll('--mod', mainModId, '--all', '--output', dataOutputPath, '--existing', mainResourcesPath)
        }
    }

    mods.maybeCreate(mainModId).sourceSet(sourceSets.main)
}

sourceSets {
    // flan/ was the old copy target of run/flan; packsManagerJar now bundles run/flan directly.
    packsmanager.resources.exclude 'flan/**'
}

// Development-only files never ship in any jar.
sourceSets.configureEach {
    resources.exclude '**/AGENTS.md', '**/*.bbmodel'
}

configurations {
    testCompileOnly.extendsFrom compileOnly
    // Mods for development runs that must not become published dependencies.
    localRuntime
    runtimeClasspath.extendsFrom localRuntime
}

neoForge.addModdingDependenciesTo(sourceSets.test)

String lombokDependency = "org.projectlombok:lombok:$version_lombok"

// Gives an additional mod source set the main mod's classpath and loads it in dev runs.
def configureModSourceSet = { SourceSet sourceSet, String modId ->
    configurations.named(sourceSet.implementationConfigurationName) { extendsFrom configurations.implementation }
    configurations.named(sourceSet.compileOnlyConfigurationName) { extendsFrom configurations.compileOnly }
    // Lombok is on every compile classpath, so its annotations must also be processed everywhere.
    dependencies.add(sourceSet.annotationProcessorConfigurationName, lombokDependency)
    dependencies.add(sourceSet.implementationConfigurationName, sourceSets.main.output)
    neoForge.addModdingDependenciesTo(sourceSet)
    neoForge.mods.maybeCreate(modId).sourceSet(sourceSet)
}

configureModSourceSet(sourceSets.packsmanager, "$packs_manager_mod_id")

/*
 * Registers an optional module described by src/<module>/fmu-module.gradle.
 * Required: sourceSet, modId, jarTask, archiveBaseName, archiveVersion.
 * Optional: directory (defaults to sourceSet), implementationTitle (defaults to sourceSet),
 *           javaCompileJvmArgs, curseforge (projectUrl, projectId, changelog,
 *           releaseType, requiredDependencies).
 */
ext.fmuModuleJars = []
ext.fmuModulePublishing = [:]
ext.registerFmuModule = { Map module ->
    def missing = ['sourceSet', 'modId', 'jarTask', 'archiveBaseName', 'archiveVersion'].findAll { !module[it]?.toString()?.trim() }
    if (missing)
        throw new GradleException("FMU module is missing required properties: ${missing.join(', ')}")

    String name = module.sourceSet.toString()
    String modId = module.modId.toString()
    String moduleVersion = module.archiveVersion.toString()
    if (module.curseforge != null && !(module.curseforge instanceof Map))
        throw new GradleException("FMU module '${name}' curseforge settings must be a map")
    fmuModulePublishing[module.jarTask.toString()] = new LinkedHashMap(module.curseforge ?: [:])
    File directory = file("src/${module.directory ?: name}")
    if (!directory.isDirectory())
        throw new GradleException("FMU module directory does not exist: ${directory}")
    if (name in sourceSets.names)
        throw new GradleException("FMU module source set '${name}' is already registered")

    def source = sourceSets.create(name) {
        java.srcDirs = [new File(directory, 'java')]
        resources.srcDirs = [new File(directory, 'resources')]
        // Plaintext optional content only ships inside the encrypted bundle below.
        resources.exclude 'encrypted/**'
    }
    configureModSourceSet(source, modId)

    File encryptedInput = new File(directory, 'resources/encrypted')
    if (encryptedInput.isDirectory() && fileTree(encryptedInput).files.any { it.isFile() }) {
        // Packaged by processResources rather than added as a resource root, so the IDE modules stay uniform.
        File generatedResources = layout.buildDirectory.dir("generated/encrypted/${name}").get().asFile
        def encryptTask = tasks.register("encrypt${name.capitalize()}UncensoredContent", EncryptOptionalContent) {
            group = 'flans mod ultimate'
            description = "Encrypt optional uncensored translations and textures for ${name}."
            inputDirectory = encryptedInput
            bundleFile = new File(generatedResources, 'flans_content/content.fmu')
            moduleId = modId
        }
        tasks.named(source.processResourcesTaskName, ProcessResources) { ProcessResources task ->
            task.from(encryptTask) { CopySpec spec -> spec.into('flans_content') }
        }
    }

    tasks.named(source.processResourcesTaskName, ProcessResources) {
        inputs.property('moduleVersion', moduleVersion)
        filesMatching(modsTomlPath) { expand(module_version: moduleVersion) }
    }

    fmuModuleJars << tasks.register(module.jarTask.toString(), Jar) {
        archiveBaseName = module.archiveBaseName.toString()
        archiveVersion = moduleVersion
        from source.output
        manifest {
            attributes([
                    'Implementation-Title'  : (module.implementationTitle ?: name).toString(),
                    'Implementation-Version': moduleVersion
            ])
        }
    }

    if (module.javaCompileJvmArgs) {
        tasks.named(source.compileJavaTaskName, JavaCompile) {
            options.fork = true
            options.forkOptions.jvmArgs.addAll(module.javaCompileJvmArgs.collect { it.toString() })
        }
    }
    return source
}

// Custom NPCs: optional at runtime for the main mod, a compile dependency of modules built on it.
ext.customNpcsDependency = files("libs/CustomNPCs-Unofficial-NeoForge-${version_custom_npcs}.jar") as DefaultConfigurableFileCollection

// Any src/<dir> with an fmu-module.gradle becomes a module, so private packs need no entry here.
file('src').listFiles()
        .findAll { it.isDirectory() && !(it.name in ['main', 'packsmanager', 'test']) && new File(it, 'fmu-module.gradle').isFile() }
        .sort { it.name }
        .each { apply from: new File(it, 'fmu-module.gradle') }

// Distant Horizons publishes its API and mod jars on Modrinth only; ModDevGradle adds the NeoForge repositories.
repositories {
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    annotationProcessor lombokDependency

    compileOnly "org.jetbrains:annotations:$version_jetbrains_annotations"
    compileOnly lombokDependency

    testImplementation platform("org.junit:junit-bom:$version_junit")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Optional client integration; the API jar only describes Distant Horizons and never ships.
    compileOnly "maven.modrinth:distanthorizonsapi:$version_distant_horizons_api"

    // Optional mods loaded only in development runs.
    localRuntime customNpcsDependency
    if (project.hasProperty('withDistantHorizons'))
        localRuntime "maven.modrinth:distanthorizons:$version_distant_horizons"
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

// Developer tooling: measures gun and driveable model muzzles for flash and particle placement.
// gradlew muzzleReport -PmodelSourceSet=<source set> -PmodelPackage=<model package> [-PreportFile=<path>]
tasks.register('muzzleReport', JavaExec) {
    group = 'flans tooling'
    description = 'Measures gun and driveable model muzzles in a package of a pack source set.'
    def modelSet = sourceSets.named(findProperty('modelSourceSet')?.toString() ?: 'main')
    dependsOn modelSet.map { it.classesTaskName }, sourceSets.test.classesTaskName
    classpath = sourceSets.test.runtimeClasspath + files(modelSet.map { it.runtimeClasspath })
    mainClass = 'com.flansmod.client.model.MuzzleReport'
    args = [findProperty('modelPackage')?.toString() ?: 'com.flansmod.client.model'] +
            (findProperty('reportFile') ? [file(findProperty('reportFile')).absolutePath] : [])
}

// Developer tooling: writes model-measured muzzles into the tracked type files, as
// /flandebug shootpoint apply does for one session, and reports the values to check by hand.
// gradlew shootPointSync [-Pwrite] [-Pfilter=<text>] [-PreportFile=<path>]
tasks.register('shootPointSync', JavaExec) {
    group = 'flans tooling'
    description = 'Syncs ShootPointPrimary, BarrelPosition, GunOrigin and AA gun Barrel lines to the measured models.'
    def packSets = sourceSets.findAll { SourceSet set ->
        set.resources.srcDirs.any { new File(it, 'flans_content').isDirectory() }
    }.sort { it.name }
    dependsOn packSets.collect { it.classesTaskName }, sourceSets.test.classesTaskName
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.flansmodultimate.tooling.shootpoints.ShootPointSync'
    // Reports what it could not do instead of failing.
    ignoreExitValue = true
    args packSets.collectMany { SourceSet set ->
        File resources = set.resources.srcDirs.find { new File(it, 'flans_content').isDirectory() }
        ['--pack-set', set.name, resources.absolutePath, set.output.classesDirs.files*.absolutePath.join(File.pathSeparator)]
    }
    if (findProperty('write') != null)
        args '--write'
    if (findProperty('filter'))
        args '--filter', findProperty('filter').toString()
    args '--report', file(findProperty('reportFile') ?: layout.buildDirectory.file('reports/shootPointSync/shoot-point-sync.md').get().asFile).absolutePath
}

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_display_name       : mod_display_name,
            mod_credits            : mod_credits,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.named('jar', Jar) {
    // The API package is MIT licensed and ships inside this jar, so its notice must too.
    from('LICENSE-API') { CopySpec spec -> spec.into('META-INF') }
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : version,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

/*
 * Public API artifacts: the MIT licensed com.flansmodultimate.api package on its own, for other mods
 * to compile against, with its sources and javadoc. Published as
 * com.flansmodultimate:flansmodultimate-api:<minecraft version>-<api_version>.
 */
String apiArtifactId = 'flansmodultimate-api'
String apiArchiveVersion = "$minecraft_version-$api_version"
String apiPackagePattern = 'com/flansmodultimate/api/**'

def apiJarTask = tasks.register('apiJar', Jar) { Jar jar ->
    jar.group = 'flans mod ultimate'
    jar.description = 'Assembles the public API classes, in Mojang names like the mod jar.'
    jar.archiveBaseName.set(apiArtifactId)
    jar.archiveVersion.set(apiArchiveVersion)
    jar.from(sourceSets.main.output) { CopySpec spec -> spec.include(apiPackagePattern) }
    jar.from('LICENSE-API') { CopySpec spec -> spec.into('META-INF') }
    jar.manifest.attributes([
            'Implementation-Title'  : apiArtifactId,
            'Implementation-Version': apiArchiveVersion,
            'Implementation-Vendor' : mod_authors
    ])
}

def apiSourcesJarTask = tasks.register('apiSourcesJar', Jar) { Jar jar ->
    jar.group = 'flans mod ultimate'
    jar.description = 'Assembles the public API sources.'
    jar.archiveBaseName.set(apiArtifactId)
    jar.archiveVersion.set(apiArchiveVersion)
    jar.archiveClassifier.set('sources')
    jar.from(sourceSets.main.allJava) { CopySpec spec -> spec.include(apiPackagePattern) }
    jar.from('LICENSE-API') { CopySpec spec -> spec.into('META-INF') }
}

def apiJavadocTask = tasks.register('apiJavadoc', Javadoc) { Javadoc task ->
    task.group = 'flans mod ultimate'
    task.description = 'Generates the javadoc of the public API.'
    task.source = sourceSets.main.allJava.matching { PatternFilterable filter -> filter.include(apiPackagePattern) }
    // The API facades call into the mod, so javadoc needs its classes to resolve their imports.
    task.classpath = sourceSets.main.compileClasspath + sourceSets.main.output
    task.destinationDir = layout.buildDirectory.dir('docs/apiJavadoc').get().asFile
    task.title = "Flan's Mod Ultimate API $apiArchiveVersion"
    StandardJavadocDocletOptions options = (StandardJavadocDocletOptions) task.options
    options.encoding = 'UTF-8'
    options.windowTitle = task.title
    // Fail on broken references and malformed HTML, but not on undocumented members.
    options.addBooleanOption('Xdoclint:all,-missing', true)
}

def apiJavadocJarTask = tasks.register('apiJavadocJar', Jar) { Jar jar ->
    jar.group = 'flans mod ultimate'
    jar.description = 'Assembles the public API javadoc.'
    jar.archiveBaseName.set(apiArtifactId)
    jar.archiveVersion.set(apiArchiveVersion)
    jar.archiveClassifier.set('javadoc')
    jar.from(apiJavadocTask)
    jar.from('LICENSE-API') { CopySpec spec -> spec.into('META-INF') }
}

// Captured as a local so the configuration cache can serialize the closures that use it.
String packsManagerVersion = packs_manager_version

tasks.named(sourceSets.packsmanager.processResourcesTaskName, ProcessResources) {
    inputs.property('packsManagerVersion', packsManagerVersion)
    filesMatching(modsTomlPath) { expand(module_version: packsManagerVersion) }
}

// Bundles the development run/flan packs for extraction by the Packs Manager.
String packsManagerBaseName = "[$minecraft_version] $packs_manager_name"
def packsManagerJar = tasks.register('packsManagerJar', Jar) { Jar jar ->
    jar.archiveBaseName.set(packsManagerBaseName)
    jar.archiveVersion.set(packsManagerVersion)
    jar.from(sourceSets.packsmanager.output)
    jar.from('run/flan') { CopySpec spec -> spec.into('flan') }
    jar.manifest.attributes([
            'Implementation-Title'  : 'packsManager',
            'Implementation-Version': packsManagerVersion
    ])
}

tasks.named('assemble') {
    dependsOn packsManagerJar, fmuModuleJars, apiJarTask, apiSourcesJarTask, apiJavadocJarTask
}

NamedDomainObjectProvider<SoftwareComponent> javaComponent = components.named('java')
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from javaComponent.get()
        }
        register('api', MavenPublication) { MavenPublication publication ->
            publication.artifactId = apiArtifactId
            publication.version = apiArchiveVersion
            publication.artifact(apiJarTask)
            publication.artifact(apiSourcesJarTask)
            publication.artifact(apiJavadocJarTask)
            publication.pom {
                name = "Flan's Mod Ultimate API"
                description = "Public API of Flan's Mod Ultimate for other mods. Compile against it; the mod itself provides it at runtime."
                url = 'https://github.com/AntonIT99/Flans-Mod-Ultimate-2.0/wiki/API'
                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://github.com/AntonIT99/Flans-Mod-Ultimate-2.0/blob/master/LICENSE-API'
                    }
                }
            }
        }
    }
    repositories {
        maven {
            url = uri("${projectDir}/repo")
        }
        // Checkout of the Maven repository served by GitHub Pages, only when given with
        // -PapiMavenRepoDir=<dir> or API_MAVEN_REPO_DIR. Only the API is published there.
        String apiMavenRepoDir = findProperty('apiMavenRepoDir')?.toString() ?: System.getenv('API_MAVEN_REPO_DIR')
        if (apiMavenRepoDir) {
            maven {
                name = 'apiPages'
                url = file(apiMavenRepoDir).toURI()
            }
        }
    }
}

tasks.withType(PublishToMavenRepository).configureEach { PublishToMavenRepository task ->
    // Decided at configuration time: the configuration cache discards task.repository.
    boolean publishable = task.repository.name != 'apiPages' || task.publication.name == 'api'
    task.onlyIf('only the API is published to GitHub Pages') { publishable }
    if (task.name == 'publishApiPublicationToApiPagesRepository') {
        File published = new File(file(task.repository.url), "com/flansmodultimate/$apiArtifactId/$apiArchiveVersion")
        task.doFirst {
            // Published versions are immutable: consumers cache them. Bump api_version instead.
            if (published.exists())
                throw new GradleException("API $apiArchiveVersion is already published at $published. Bump api_version first.")
        }
    }
}

// Each checkout publishes only its own Minecraft version and loader.
ext.curseforgeModLoader = 'NeoForge'
apply from: 'gradle/curseforge.gradle'

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xlint:deprecation', '-Xlint:unchecked'])
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

/*
 * Packs lang/texture assets into the authenticated FMUENC01 bundle read at runtime.
 * Keep the format, key derivation, and file order in sync with the mod's decoder.
 */
abstract class EncryptOptionalContent extends DefaultTask {
    @InputDirectory
    @PathSensitive(PathSensitivity.RELATIVE)
    abstract DirectoryProperty getInputDirectory()

    @Input
    abstract Property<String> getModuleId()

    @OutputFile
    abstract RegularFileProperty getBundleFile()

    @TaskAction
    void encrypt() {
        def utf8 = StandardCharsets.UTF_8
        def inputPath = inputDirectory.get().asFile.toPath()
        File bundle = bundleFile.get().asFile
        byte[] modId = moduleId.get().getBytes(utf8)

        List<java.nio.file.Path> files
        try (def paths = Files.walk(inputPath)) {
            files = paths.filter { Files.isRegularFile(it) }
                    .sorted { a, b -> a.toAbsolutePath().toString() <=> b.toAbsolutePath().toString() }
                    .toList()
        }
        if (files.isEmpty()) {
            Files.deleteIfExists(bundle.toPath())
            logger.lifecycle("No uncensored resources found for ${moduleId.get()}.")
            return
        }

        def archiveBytes = new ByteArrayOutputStream()
        new DataOutputStream(archiveBytes).withCloseable { archive ->
            archive.writeInt(0x464D5552) // FMUR
            archive.writeInt(1)
            archive.writeInt(files.size())
            files.each { file ->
                String relativePath = inputPath.relativize(file).toString().replace(File.separator, '/')
                String[] segments = relativePath.split('/')
                if (segments.length < 4 || segments[0] != 'assets' || segments[1].isBlank())
                    throw new GradleException("Uncensored resources must use assets/<namespace>/... paths: ${relativePath}")
                String assetPath = segments.drop(2).join('/')
                if (!(assetPath.startsWith('lang/') || assetPath.startsWith('textures/')))
                    throw new GradleException("Only lang and textures assets may be encrypted: ${relativePath}")

                byte[] data = Files.readAllBytes(file)
                archive.writeUTF(relativePath)
                archive.writeInt(data.length)
                archive.write(data)
            }
        }
        byte[] plaintext = archiveBytes.toByteArray()

        def keyDigest = MessageDigest.getInstance('SHA-256')
        keyDigest.update('Flans Mod Ultimate uncensored resources v1'.getBytes(utf8))
        keyDigest.update((byte) 0)
        byte[] key = keyDigest.digest(modId)

        def ivDigest = MessageDigest.getInstance('SHA-256')
        ivDigest.update(plaintext)
        ivDigest.update((byte) 0)
        byte[] iv = Arrays.copyOf(ivDigest.digest(modId), 12)

        byte[] magic = 'FMUENC01'.getBytes(StandardCharsets.US_ASCII)
        def cipher = Cipher.getInstance('AES/GCM/NoPadding')
        cipher.init(Cipher.ENCRYPT_MODE,
                new SecretKeySpec(key, 'AES'),
                new GCMParameterSpec(128, iv))
        cipher.updateAAD(magic)
        cipher.updateAAD(modId)
        byte[] encrypted = cipher.doFinal(plaintext)

        bundle.withDataOutputStream { output ->
            output.write(magic)
            output.writeInt(1)
            output.writeByte(iv.length)
            output.write(iv)
            output.writeInt(encrypted.length)
            output.write(encrypted)
        }
        logger.lifecycle("Encrypted ${files.size()} optional resource(s) into ${bundle}.")
    }
}
