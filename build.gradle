plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
    id 'org.spongepowered.mixin' version '0.7.+'
    id 'com.github.johnrengelman.shadow' version '7.1.2'
}

apply plugin: 'idea'

version = mod_version
group = mod_group_id

base {
    archivesName = "[$minecraft_version] $mod_name"
}

// Mojang ships Java 17 to end users in 1.18+, so your mod should target Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

minecraft {
    mappings channel: mapping_channel, version: mapping_version

    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')

            ideaModule "${project.name.replace('.', '_')}.main"

            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
            property 'forge.logging.console.level', 'debug'

            property 'terminal.ansi', 'true'
            property 'terminal.jline', 'true'
            property 'terminal.keepMinecraftFormatting', 'true'

            // Only the fixed main module is declared here.
            // Additional modules register themselves from src/*/fmu-module.gradle.
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

configurations {
    // Create the library configuration, where our non-mod libraries will be added to.
    library
    implementation.extendsFrom library

    // packsmanager stays a fixed source set.
    packsManagerImplementation.extendsFrom implementation
    packsManagerRuntimeOnly.extendsFrom runtimeOnly
}

// Configure all runs with the following.
minecraft.runs.all {
    lazyToken('minecraft_classpath') {
        configurations.library.copyRecursive().resolve().collect { it.absolutePath }.join(File.pathSeparator)
    }
}

// Fixed source sets. All optional/public/private pack modules are discovered dynamically below.
sourceSets {
    main {
        java {
            srcDirs = ['src/main/java']
        }
        resources {
            srcDirs = ['src/main/resources']
        }
    }

    packsManager {
        java {
            srcDirs = ['src/packsmanager/java']
        }
        resources {
            srcDirs = ['src/packsmanager/resources']
        }
    }

    test {
        java {
            srcDirs = ['src/test/java']
        }
        resources {
            srcDirs = ['src/test/resources']
        }
    }
}

/*
 * Registers an FMU module described by a src/<module>/fmu-module.gradle script.
 *
 * Required properties:
 *   sourceSet       - Gradle source-set name. Usually identical to the directory name.
 *   modId           - Forge mod id used in development runs.
 *   jarTask         - Name of the Jar task to create.
 *   archiveBaseName - Output jar base name.
 *   archiveVersion  - Output jar version.
 *
 * Optional properties:
 *   directory          - Directory below src/. Defaults to sourceSet.
 *   implementationTitle - Manifest Implementation-Title. Defaults to sourceSet.
 *   javaCompileJvmArgs - JVM arguments for this source set's javac process.
 */
ext.registerFmuModule = { Map module ->
    def requiredKeys = ['sourceSet', 'modId', 'jarTask', 'archiveBaseName', 'archiveVersion']
    def missingKeys = requiredKeys.findAll { !module.containsKey(it) || module[it] == null || module[it].toString().isBlank() }

    if (!missingKeys.isEmpty()) {
        throw new GradleException("FMU module definition is missing required properties: ${missingKeys.join(', ')}")
    }

    String sourceSetName = module.sourceSet.toString()
    String moduleDirectoryName = (module.directory ?: sourceSetName).toString()
    String moduleModId = module.modId.toString()
    String jarTaskName = module.jarTask.toString()
    String moduleArchiveBaseName = module.archiveBaseName.toString()
    String moduleArchiveVersion = module.archiveVersion.toString()
    String implementationTitle = (module.implementationTitle ?: sourceSetName).toString()

    File moduleDirectory = file("src/${moduleDirectoryName}")

    if (!moduleDirectory.isDirectory()) {
        throw new GradleException("FMU module directory does not exist: ${moduleDirectory}")
    }

    if (sourceSets.findByName(sourceSetName) != null) {
        throw new GradleException("FMU module source set '${sourceSetName}' is already registered")
    }

    def moduleSourceSet = sourceSets.create(sourceSetName) {
        java {
            srcDirs = [new File(moduleDirectory, 'java')]
        }
        resources {
            srcDirs = [new File(moduleDirectory, 'resources')]
        }
    }

    // Creating a SourceSet also creates its Implementation/RuntimeOnly configurations.
    configurations.named(moduleSourceSet.implementationConfigurationName) {
        extendsFrom configurations.implementation
    }
    configurations.named(moduleSourceSet.runtimeOnlyConfigurationName) {
        extendsFrom configurations.runtimeOnly
    }

    // Pack modules can compile against classes produced by the main mod.
    dependencies.add(moduleSourceSet.implementationConfigurationName, sourceSets.main.output)

    // Make the module available in every ForgeGradle development run.
    minecraft.runs.configureEach { runConfig ->
        def modConfig = runConfig.mods.maybeCreate(moduleModId)
        modConfig.source(moduleSourceSet)
    }

    def moduleJar = tasks.register(jarTaskName, Jar) {
        archiveBaseName.set(moduleArchiveBaseName)
        archiveVersion.set(moduleArchiveVersion)

        from moduleSourceSet.output

        manifest {
            attributes(
                    'Implementation-Title': implementationTitle,
                    'Implementation-Version': moduleArchiveVersion
            )
        }
    }

    artifacts.add('archives', moduleJar)

    if (module.javaCompileJvmArgs) {
        tasks.named(moduleSourceSet.compileJavaTaskName, JavaCompile).configure {
            options.fork = true
            options.forkOptions.jvmArgs.addAll(module.javaCompileJvmArgs.collect { it.toString() })
        }
    }

    return moduleSourceSet
}

/*
 * Discover optional modules without naming them in the root build.
 *
 * main, packsmanager and test stay fixed. Any other directory directly below src/
 * becomes a module only if it contains fmu-module.gradle.
 *
 * This also allows a private nested Git repository to live under src/: its directory
 * and module metadata never need to appear in this public build.gradle.
 */
def fixedSourceDirectories = ['main', 'packsmanager', 'test'] as Set
File srcDirectory = file('src')

if (srcDirectory.isDirectory()) {
    srcDirectory.listFiles()
            .findAll { it.isDirectory() && !fixedSourceDirectories.contains(it.name) }
            .sort { a, b -> a.name <=> b.name }
            .each { moduleDirectory ->
                File moduleScript = new File(moduleDirectory, 'fmu-module.gradle')
                if (moduleScript.isFile()) {
                    apply from: moduleScript
                }
            }
}

repositories {
    // Put repositories for dependencies here.
    // ForgeGradle automatically adds the Forge maven and Maven Central for you.
    flatDir {
        dir 'libs'
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
    debug.verbose = true
    debug.export = true
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    annotationProcessor 'org.spongepowered:mixin:0.8.6:processor'
    annotationProcessor 'org.projectlombok:lombok:1.18.42'

    compileOnly 'org.jetbrains:annotations:26.0.2'
    compileOnly 'org.projectlombok:lombok:1.18.42'

    testImplementation platform('org.junit:junit-bom:5.10.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'

    implementation fg.deobf('libs:CustomNPCs:1.20.1-GBPort-Unofficial-1.20.1.20260711')
    implementation fg.deobf('libs:flansmod:1.20.1-0.4.316')
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

shadowJar {
    mergeServiceFiles()
}

// This block of code expands all declared replace properties in the specified resource targets.
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }

    exclude 'config/AGENTS.md'
}

// Main mod jar.
tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'MixinConfigs'            : "${mod_id}.mixins.json"
        ])
    }

    finalizedBy 'reobfJar'
}

// packsmanager remains fixed because it has special copy/build behavior.
def copyFlanPacksToManager = tasks.register('copyFlanPacksToManager') {
    doFirst {
        def targetDir = file('src/packsmanager/resources/flan')
        if (targetDir.exists()) {
            targetDir.deleteDir()
        }
    }

    doLast {
        copy {
            from 'run/flan'
            into 'src/packsmanager/resources/flan'
        }
    }
}

def packsManagerJar = tasks.register('packsManagerJar', Jar) {
    dependsOn tasks.named('copyFlanPacksToManager')

    archiveBaseName.set("[$minecraft_version] $mod_name_packs_manager")
    archiveVersion.set(packs_manager_version)

    from sourceSets.packsManager.output

    manifest {
        attributes(
                'Implementation-Title': 'packsManager',
                'Implementation-Version': packs_manager_version
        )
    }
}

artifacts {
    archives packsManagerJar
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
