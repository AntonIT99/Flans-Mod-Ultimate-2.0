plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.143'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude('**/AGENTS.md')

    exclude("src/generated/**/.cache") // datagen cache files
}

sourceSets {
    packsmanager {
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
    test {
        // ModDevGradle attaches the remapped Minecraft/NeoForge artifacts to
        // the main source set. Unit tests exercise classes with Minecraft API
        // signatures, so they need the same remapped classpaths as main.
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}

// Keep optional pack discovery driven by the module descriptors shared with master.
def fmuModules = []
ext.registerFmuModule = { Map module ->
    def required = ['sourceSet', 'modId', 'jarTask', 'archiveBaseName', 'archiveVersion']
    def missing = required.findAll { !module[it]?.toString()?.trim() }
    if (missing) throw new GradleException("FMU module is missing: ${missing.join(', ')}")
    String name = module.sourceSet.toString()
    File directory = file("src/${module.directory ?: name}")
    if (!directory.isDirectory() || sourceSets.findByName(name))
        throw new GradleException("Invalid or duplicate FMU module: ${name}")
    def source = sourceSets.create(name) {
        java.srcDirs = [new File(directory, 'java')]
        resources.srcDirs = [new File(directory, 'resources')]
        resources.exclude 'encrypted/**'
    }
    source.compileClasspath += sourceSets.main.compileClasspath
    source.runtimeClasspath += sourceSets.main.runtimeClasspath
    configurations.named(source.implementationConfigurationName) { extendsFrom configurations.implementation }
    configurations.named(source.compileOnlyConfigurationName) { extendsFrom configurations.compileOnly }
    configurations.named(source.annotationProcessorConfigurationName) { extendsFrom configurations.annotationProcessor }
    dependencies.add(source.implementationConfigurationName, sourceSets.main.output)

    // Optional plaintext assets live with their pack under resources/encrypted
    // and are gitignored. Only the authenticated encrypted bundle produced here
    // is added to the module JAR.
    File encryptedInputDirectory = new File(directory, 'resources/encrypted')
    boolean hasEncryptedInput = encryptedInputDirectory.isDirectory()
            && fileTree(encryptedInputDirectory).files.any { it.isFile() }
    if (hasEncryptedInput) {
        File encryptedGeneratedResources = file("${buildDir}/generated/encrypted/${name}")
        File encryptedBundle = new File(encryptedGeneratedResources, 'flans_content/content.fmu')
        String encryptionTaskName = "encrypt${name.capitalize()}UncensoredContent"
        def encryptionTask = tasks.register(encryptionTaskName) {
            group = 'flans mod ultimate'
            description = "Encrypt optional uncensored translations and textures for ${name}."
            if (encryptedInputDirectory.isDirectory())
                inputs.dir(encryptedInputDirectory).withPathSensitivity(PathSensitivity.RELATIVE)
            else
                inputs.property('uncensoredInputPresent', false)
            outputs.file(encryptedBundle)

            doLast {
                project.delete(encryptedGeneratedResources)
                if (!encryptedInputDirectory.isDirectory()) {
                    logger.lifecycle("No encrypted-content input directory for ${name}: ${encryptedInputDirectory}")
                    return
                }

                List<File> sourceFiles = fileTree(encryptedInputDirectory)
                        .files
                        .findAll { it.isFile() }
                        .sort { left, right -> left.absolutePath <=> right.absolutePath }
                if (sourceFiles.isEmpty()) {
                    logger.lifecycle("No uncensored resources found for ${name}.")
                    return
                }

                Map<File, String> resourcePaths = new LinkedHashMap<>()
                sourceFiles.each { sourceFile ->
                    String relativePath = encryptedInputDirectory.toPath().relativize(sourceFile.toPath())
                            .toString().replace(File.separator, '/')
                    String[] segments = relativePath.split('/')
                    if (segments.length < 4 || segments[0] != 'assets' || segments[1].isBlank())
                        throw new GradleException("Uncensored resources must use assets/<namespace>/... paths: ${relativePath}")

                    String assetPath = segments.drop(2).join('/')
                    if (!(assetPath.startsWith('lang/') || assetPath.startsWith('textures/')))
                        throw new GradleException("Only lang and textures assets may be encrypted: ${relativePath}")
                    resourcePaths.put(sourceFile, relativePath)
                }

                def archiveBytes = new ByteArrayOutputStream()
                def archive = new DataOutputStream(archiveBytes)
                archive.writeInt(0x464D5552) // FMUR
                archive.writeInt(1)
                archive.writeInt(resourcePaths.size())
                resourcePaths.each { sourceFile, relativePath ->
                    byte[] data = java.nio.file.Files.readAllBytes(sourceFile.toPath())
                    archive.writeUTF(relativePath)
                    archive.writeInt(data.length)
                    archive.write(data)
                }
                archive.close()
                byte[] plaintext = archiveBytes.toByteArray()

                String keySalt = 'Flans Mod Ultimate uncensored resources v1'
                def keyDigest = java.security.MessageDigest.getInstance('SHA-256')
                keyDigest.update(keySalt.getBytes(java.nio.charset.StandardCharsets.UTF_8))
                keyDigest.update((byte) 0)
                byte[] key = keyDigest.digest(module.modId.toString().getBytes(java.nio.charset.StandardCharsets.UTF_8))

                def ivDigest = java.security.MessageDigest.getInstance('SHA-256')
                ivDigest.update(plaintext)
                ivDigest.update((byte) 0)
                byte[] iv = java.util.Arrays.copyOf(
                        ivDigest.digest(module.modId.toString().getBytes(java.nio.charset.StandardCharsets.UTF_8)), 12)

                byte[] magic = 'FMUENC01'.getBytes(java.nio.charset.StandardCharsets.US_ASCII)
                def cipher = javax.crypto.Cipher.getInstance('AES/GCM/NoPadding')
                cipher.init(javax.crypto.Cipher.ENCRYPT_MODE,
                        new javax.crypto.spec.SecretKeySpec(key, 'AES'),
                        new javax.crypto.spec.GCMParameterSpec(128, iv))
                def aad = new ByteArrayOutputStream()
                aad.write(magic)
                aad.write(module.modId.toString().getBytes(java.nio.charset.StandardCharsets.UTF_8))
                cipher.updateAAD(aad.toByteArray())
                byte[] encrypted = cipher.doFinal(plaintext)

                java.nio.file.Files.createDirectories(encryptedBundle.parentFile.toPath())
                def output = new DataOutputStream(new FileOutputStream(encryptedBundle))
                output.write(magic)
                output.writeInt(1)
                output.writeByte(iv.length)
                output.write(iv)
                output.writeInt(encrypted.length)
                output.write(encrypted)
                output.close()
                logger.lifecycle("Encrypted ${resourcePaths.size()} optional resource(s) into ${encryptedBundle}.")
            }
        }
        source.resources.srcDir(encryptedGeneratedResources)
        tasks.named(source.processResourcesTaskName).configure {
            dependsOn encryptionTask
        }
    }

    def jarTask = tasks.register(module.jarTask.toString(), Jar) {
        archiveBaseName.set(module.archiveBaseName.toString())
        archiveVersion.set(module.archiveVersion.toString())
        from source.output
        manifest {
            attributes('Implementation-Title': (module.implementationTitle ?: name).toString(),
                       'Implementation-Version': module.archiveVersion.toString())
        }
    }
    if (module.javaCompileJvmArgs) {
        tasks.named(source.compileJavaTaskName, JavaCompile).configure {
            options.fork = true
            options.forkOptions.jvmArgs.addAll(module.javaCompileJvmArgs.collect { it.toString() })
        }
    }
    fmuModules.add([source: source, modId: module.modId.toString(), jarTask: jarTask])
    return source
}

file('src').listFiles().findAll { it.isDirectory() &&
    !(['main', 'packsmanager', 'test'] as Set).contains(it.name) &&
    new File(it, 'fmu-module.gradle').isFile()
}.sort { a, b -> a.name <=> b.name }.each { apply from: new File(it, 'fmu-module.gradle') }

repositories {
    // Add here additional repositories if required by some of the dependencies below.
}

base {
    archivesName = "[$minecraft_version] $mod_name"
}

// Mojang ships Java 21 to end users in 1.21, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
        "flansmodultimate_packs_manager" { sourceSet(sourceSets.packsmanager) }
        fmuModules.each { module ->
            "${module.modId}" { sourceSet(module.source) }
        }
    }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
    packsmanagerImplementation.extendsFrom implementation
    packsmanagerCompileOnly.extendsFrom compileOnly
    packsmanagerAnnotationProcessor.extendsFrom annotationProcessor
}

dependencies {
    packsmanagerImplementation sourceSets.main.output
    annotationProcessor 'org.projectlombok:lombok:1.18.42'

    compileOnly 'org.jetbrains:annotations:26.0.2'
    compileOnly 'org.projectlombok:lombok:1.18.42'

    testImplementation platform('org.junit:junit-bom:5.10.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Optional compatibility mod used only in local development runs. Keeping
    // it off the published/compile API prevents unrelated consumers from
    // inheriting this local file dependency.
    localRuntime files('libs/CustomNPCs-Unofficial-NeoForge-1.21.1.20251230.jar')

    // Example optional mod dependency with JEI
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // compileOnly "mezz.jei:jei-${mc_version}-neoforge-api:${jei_version}"
    // We add the full version to localRuntime, not runtimeOnly, so that we do not publish a dependency on it
    // localRuntime "mezz.jei:jei-${mc_version}-neoforge:${jei_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_display_name       : mod_display_name,
            mod_credits            : mod_credits,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = uri("${project.projectDir}/repo")
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
    options.compilerArgs.addAll(['-Xlint:deprecation', '-Xlint:unchecked'])
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

def packsManagerJar = tasks.register('packsManagerJar', Jar) {
    archiveBaseName.set("[$minecraft_version] $mod_name_packs_manager")
    archiveVersion.set(packs_manager_version)
    from sourceSets.packsmanager.output
    from('run/flan') { into 'flan' }
    manifest {
        attributes('Implementation-Title': 'packsManager',
                   'Implementation-Version': packs_manager_version)
    }
}

tasks.named('assemble').configure {
    dependsOn packsManagerJar
    dependsOn fmuModules.collect { it.jarTask }
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
