import groovy.json.JsonSlurper
import java.security.MessageDigest

// Optional developer tool: neither the downloaded jar nor Node dependencies ship.
def mcpTarget = new JsonSlurper().parse(file('tools/minecraft-mcp/target.json'))
String mcpName = "minecraft-mcp-${mcpTarget.version}-${mcpTarget.loader}-v${mcpTarget.modVersion}.jar"
String mcpUrl = "https://github.com/langyo/minecraft-mod-mcp/releases/download/v${mcpTarget.modVersion}/${mcpName}"
String mcpHash = mcpTarget.sha256
def mcpJar = layout.buildDirectory.file("minecraft-mcp/${mcpName}")
def downloadMcp = tasks.register('prepareMinecraftMcp') {
    group = 'development'
    description = 'Download the pinned Minecraft MCP development mod and verify its SHA-256.'
    inputs.property('url', mcpUrl)
    inputs.property('sha256', mcpHash)
    outputs.file(mcpJar)
    doLast {
        File output = mcpJar.get().asFile
        output.parentFile.mkdirs()
        File partial = new File(output.parentFile, output.name + '.part')
        try
        {
            def connection = URI.create(mcpUrl).toURL().openConnection()
            connection.connectTimeout = 30000
            connection.readTimeout = 60000
            connection.getInputStream().withCloseable { input -> partial.withOutputStream { it << input } }
            String actual = MessageDigest.getInstance('SHA-256').digest(partial.bytes).encodeHex().toString()
            if (actual != mcpHash)
                throw new GradleException("Minecraft MCP SHA-256 mismatch: ${actual}")
            java.nio.file.Files.move(partial.toPath(), output.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        }
        finally
        {
            partial.delete()
        }
    }
}

// Register the mapped companion for ordinary Gradle/IDE imports; only MCP client runs use it.
def mcpDev = sourceSets.create('mcpDev') {
    compileClasspath += sourceSets.npcs.compileClasspath + sourceSets.npcs.output
}
dependencies.add(mcpDev.compileOnlyConfigurationName, files(mcpJar).builtBy(downloadMcp))

boolean mcpOnEveryClient = project.hasProperty('withMinecraftMcp')
if (!project.hasProperty('withoutMinecraftMcp') && (mcpJar.get().asFile.isFile() || mcpOnEveryClient))
{
    // ModDevGradle loads every registered mod in every run; the companion stays idle unless a run sets fmu.mcp.port.
    neoForge.mods.maybeCreate('flansmcpdev').sourceSet(mcpDev)
    // Keep the normal client plain; this sibling uses the same account, packs and world directory with MCP.
    String mcpGameTestNamespace = mod_id
    neoForge.runs.create('clientMcp') {
        client()
        programArguments.addAll('--username', 'Player1')
        systemProperty 'neoforge.enabledGameTestNamespaces', mcpGameTestNamespace
    }
    String captureDir = layout.buildDirectory.dir('minecraft-mcp/captures').get().asFile.absolutePath
    File testProfile = file('run/mcp-test')
    File secondTestProfile = file('run/mcp-test-2')
    String width = providers.gradleProperty('mcpWidth').getOrElse('1280')
    String height = providers.gradleProperty('mcpHeight').getOrElse('800')
    boolean useTestProfile = project.hasProperty('mcpTestProfile')
    def mcpRuntime = dependencies.create(files(mcpJar).builtBy(downloadMcp))
    neoForge.runs.configureEach { run ->
        if (run.name == 'clientMcp' || mcpOnEveryClient && run.name.startsWith('client'))
        {
            // Only these runs put the MCP mod on their classpath; servers and the plain client never see it.
            run.additionalRuntimeClasspathConfiguration.dependencies.add(mcpRuntime)
            boolean second = run.name == 'client2'
            systemProperty 'mcp.port', (second ? mcpTarget.secondPort : mcpTarget.port).toString()
            systemProperty 'mcp.background_input', 'true'
            systemProperty 'mcp.mod.version', mcpTarget.modVersion.toString()
            systemProperty 'mcp.mod.loader', mcpTarget.loader.toString()
            systemProperty 'fmu.mcp.port', (second ? mcpTarget.secondPort + 100 : mcpTarget.port + 100).toString()
            systemProperty 'fmu.mcp.captureDir', captureDir
            if (useTestProfile)
            {
                gameDirectory = second ? secondTestProfile : testProfile
                systemProperty 'fmu.mcp.testProfile', 'true'
                programArguments.addAll('--width', width, '--height', height)
            }
        }
    }
}
