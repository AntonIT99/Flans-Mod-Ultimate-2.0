// Optional local test server; no bot library or development server ships in jars.
File mineflayerDirectory = layout.buildDirectory.dir('mineflayer/server').get().asFile
def prepareMineflayer = tasks.register('prepareMineflayerServer', Exec) {
    group = 'development'
    description = 'Prepare an isolated, loopback-only Mineflayer test server using existing EULA acceptance.'
    workingDir rootDir
    commandLine 'node', file('tools/mineflayer/prepare.mjs').absolutePath
}

// Keep the source set available to IDE imports even when the test server is disabled.
def development = sourceSets.create('mineflayerdev')
neoForge.addModdingDependenciesTo(development)

if (project.hasProperty('withMineflayer'))
{
    neoForge.mods.maybeCreate('flansmineflayerdev').sourceSet(development)
    neoForge.runs.named('server') {
        gameDirectory = mineflayerDirectory
        systemProperty 'fmu.mineflayer.runtime', new File(mineflayerDirectory, 'runtime.json').absolutePath
        systemProperty 'terminal.jline', 'false'
        systemProperty 'terminal.ansi', 'false'
    }
    tasks.matching { it.name == 'runServer' }.configureEach {
        dependsOn prepareMineflayer
        doFirst { JavaExec task -> task.standardInput = System.in }
    }
}
