# version for additions and the major version for breaking changes. Fixes that change neither the
# contract nor the API classes need no bump.
api_version=0.3

## Packs Manager Properties
packs_manager_mod_id= flansmodultimate_packs_manager
packs_manager_name=Flan's Mod Ultimate Packs Manager
packs_manager_version=1.0

## CurseForge Publishing
# A blank URL disables that artifact's upload task. Fill in its URL and numeric
# project ID from the CurseForge project page. Keep CURSEFORGE_API_TOKEN in the
# environment, never in this file. See docs/curseforge-releases.md.
curseforgeModProjectUrl=https://www.curseforge.com/minecraft/mc-mods/flans-mod-ultimate-2
curseforgeModProjectId=1641166
curseforgePacksManagerProjectUrl=
curseforgePacksManagerProjectId=
# Module destinations live in src/*/fmu-module.gradle (curseforge map).
# Optional property overrides use the same pattern: curseforge<JarTaskWithoutJar>ProjectUrl/ProjectId,
# with the first letter capitalized. Optional overrides: Changelog, ReleaseType,
# RequiredDependencies (comma-separated CurseForge slugs).
curseforgeReleaseType=release
curseforgeChangelog=CHANGELOG.md

