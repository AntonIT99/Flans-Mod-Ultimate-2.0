## Mod Properties
mod_id=flansmodultimate
mod_name=Flan's Mod Ultimate
mod_display_name=Flan's Mod Ultimate 2
mod_credits=Based on Flan's Mod by Jamioflan and contributors, and the legacy Flan's Mod Ultimate Stability Edition project. See the bundled license and repository attribution for details.
