modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
logoFile="flansmodultimate2.png"
credits="All code contributors."
authors="Wolff, Jamioflan"
description='''Unofficial continuation of Flan's Mod to load content packs designed for legacy versions'''

[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="flansmodultimate_packs"
    type="optional"
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"