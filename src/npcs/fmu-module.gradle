def npcsSourceSet = registerFmuModule(
    sourceSet: 'npcs',
    modId: 'wolffsmodnpcs',
    jarTask: 'npcsJar',
    displayName: "Flan's Mod Ultimate Wolff's NPC Vehicles & Soldiers",
    // Match the main mod's major.minor compatibility line; the patch is this module's own revision.
    archiveVersion: '2.3.0',
    // A blank projectUrl disables this module's CurseForge upload.
    curseforge: [projectUrl: 'https://www.curseforge.com/minecraft/mc-mods/flans-ultimate-2-wolffs-npc-vehicles-and-soldiers', projectId: '1771194', requiredDependencies: ['customnpcs-unofficial']],
    implementationTitle: 'npcs'
)

// Custom NPCs is a mandatory dependency of this module; the main mod already loads it in dev runs.
dependencies.add(obfuscation.createRemappingConfiguration(configurations.named(npcsSourceSet.compileOnlyConfigurationName).get()).name, customNpcsDependency)
dependencies.add(npcsSourceSet.annotationProcessorConfigurationName, "org.spongepowered:mixin:$version_mixin:processor")
// Geometry-framing tests use the module's client helper without loading Custom NPCs.
dependencies.add('testImplementation', npcsSourceSet.output)
// Equipment integration tests exercise the installed NPC inventory; dev runtime already provides the dependency.
dependencies.add(obfuscation.createRemappingConfiguration(configurations.testCompileOnly).name, customNpcsDependency)

// Real-server regression tests are a separate development mod and never enter npcsJar.
def npcGameTestSourceSet = sourceSets.create('npcGameTest') {
    compileClasspath += npcsSourceSet.compileClasspath + npcsSourceSet.output
    runtimeClasspath += npcsSourceSet.runtimeClasspath
}
def npcGameTestMod = legacyForge.mods.create('wolffsmodnpcstests') {
    sourceSet npcGameTestSourceSet
}
legacyForge.runs.configureEach {
    if (name != 'gameTestServer')
        loadedMods = provider { legacyForge.mods.findAll { it != npcGameTestMod } }
}
legacyForge.runs.named('gameTestServer') {
    gameDirectory = file('run/gametest')
}

// Keep the Custom NPCs hook in this optional artifact, including its own refmap.
def npcsRefmap = mixin.add(npcsSourceSet, 'wolffsmodnpcs.refmap.json')
// ModDevGradle feeds every refmap's SRG mappings to every reobfuscation, so all of them must wait for it.
tasks.matching { it.name.startsWith('reobf') }.configureEach { dependsOn npcsSourceSet.compileJavaTaskName }
// Dev runs load this module's mixins alongside the main mod's.
mixin.config 'wolffsmodnpcs.mixins.json'
tasks.named('npcsJar', Jar) {
    manifest.attributes('MixinConfigs': 'wolffsmodnpcs.mixins.json')
    from(npcsRefmap)
}
