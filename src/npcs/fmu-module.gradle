def npcsSourceSet = registerFmuModule(
    sourceSet: 'npcs',
    modId: 'wolffsmodnpcs',
    jarTask: 'npcsJar',
    displayName: "Flan's Mod Ultimate Wolff's NPC Vehicles & Soldiers",
    // Match the main mod's major.minor compatibility line; the patch is this module's own revision.
    archiveVersion: '2.2.1',
    // A blank projectUrl disables this module's CurseForge upload.
    curseforge: [projectUrl: 'https://www.curseforge.com/minecraft/mc-mods/flans-ultimate-2-wolffs-npc-vehicles-and-soldiers', projectId: '1771194', changelog: 'src/npcs/CHANGELOG.md', requiredDependencies: ['customnpcs-unofficial']],
    implementationTitle: 'npcs'
)

// Custom NPCs is a mandatory dependency of this module; the main mod already loads it in dev runs.
// NeoForge 1.21.1 runs Mojang names in production, so the jar ships as compiled, like every module.
dependencies.add(npcsSourceSet.compileOnlyConfigurationName, customNpcsDependency)
// Geometry-framing tests use the module's client helper without loading Custom NPCs.
dependencies.add('testImplementation', npcsSourceSet.output)
// Vanilla 1.21.1 makes LivingEntity.getDimensions final; Custom NPCs' runtime access transformer opens it.
neoForge.accessTransformers.from(file('src/npcs/customnpcs-accesstransformer.cfg'))
// Equipment integration tests exercise the installed NPC inventory; the test runtime already provides the dependency.
dependencies.add('testCompileOnly', customNpcsDependency)

// Real-server regression tests are a separate development mod and never enter npcsJar.
def npcGameTestSourceSet = sourceSets.create('npcGameTest') {
    compileClasspath += npcsSourceSet.compileClasspath + npcsSourceSet.output
    runtimeClasspath += npcsSourceSet.runtimeClasspath
}
def npcGameTestMod = neoForge.mods.create('wolffsmodnpcstests') {
    sourceSet npcGameTestSourceSet
}
neoForge.runs.configureEach {
    if (name != 'gameTestServer')
        loadedMods = provider { neoForge.mods.findAll { it != npcGameTestMod } }
}
neoForge.runs.named('gameTestServer') {
    gameDirectory = file('run/gametest')
}
