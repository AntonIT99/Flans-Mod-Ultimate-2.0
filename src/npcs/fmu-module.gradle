def npcsSourceSet = registerFmuModule(
    sourceSet: 'npcs',
    modId: 'wolffsmodnpcs',
    jarTask: 'npcsJar',
    archiveBaseName: "[$minecraft_version] Flan's Mod Ultimate Wolff's NPC Vehicles & Soldiers",
    archiveVersion: '1.0',
    // A blank projectUrl disables this module's CurseForge upload.
    curseforge: [projectUrl: '', projectId: ''],
    implementationTitle: 'npcs'
)

// Custom NPCs is a mandatory dependency of this module; the main mod already loads it in dev runs.
dependencies.add(npcsSourceSet.compileOnlyConfigurationName, fg.deobf(customNpcsDependency))
dependencies.add(npcsSourceSet.annotationProcessorConfigurationName, "org.spongepowered:mixin:$version_mixin:processor")
// Geometry-framing tests use the module's client helper without loading Custom NPCs.
dependencies.add('testImplementation', npcsSourceSet.output)

// Keep the Custom NPCs hook in this optional artifact, including its own refmap.
mixin.add(npcsSourceSet, 'wolffsmodnpcs.refmap.json')
tasks.named('npcsJar') {
    manifest.attributes('MixinConfigs': 'wolffsmodnpcs.mixins.json')
    // The shared module helper disables MixinGradle's jar mutation (which adds the main config).
    // Package this module's generated map explicitly instead.
    from(layout.buildDirectory.file("tmp/${npcsSourceSet.compileJavaTaskName}/wolffsmodnpcs.refmap.json"))
}
// MixinGradle rewrites the launch arguments during afterEvaluate. Append the module's
// config afterwards so generated IDE runs retain it as well as the main mod's config.
afterEvaluate {
    minecraft.runs.configureEach {
        args '--mixin.config', 'wolffsmodnpcs.mixins.json'
    }
}
