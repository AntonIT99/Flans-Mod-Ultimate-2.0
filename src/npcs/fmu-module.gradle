def npcsSourceSet = registerFmuModule(
    sourceSet: 'npcs',
    modId: 'wolffsmodnpcs',
    jarTask: 'npcsJar',
    archiveBaseName: "[$minecraft_version] Flan's Mod Ultimate Wolff's NPC Vehicles & Soldiers",
    archiveVersion: '1.0',
    implementationTitle: 'npcs'
)

// Custom NPCs is a mandatory dependency of this module; the main mod already loads it in dev runs.
// NeoForge 1.21.1 runs Mojang names in production, so the jar ships as compiled, like the content packs.
dependencies.add(npcsSourceSet.compileOnlyConfigurationName, customNpcsDependency)
