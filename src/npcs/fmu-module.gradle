def npcsSourceSet = registerFmuModule(
    sourceSet: 'npcs',
    modId: 'wolffsmodnpcs',
    jarTask: 'npcsJar',
    archiveBaseName: "[$minecraft_version] Flan's Mod Ultimate Wolff's NPC Vehicles & Soldiers",
    archiveVersion: '1.0',
    // A blank projectUrl disables this module's CurseForge upload.
    curseforge: [projectUrl: '', projectId: ''],
    implementationTitle: 'npcs'
)

// Custom NPCs is a mandatory dependency of this module; the main mod already loads it in dev runs.
// NeoForge 1.21.1 runs Mojang names in production, so the jar ships as compiled, like every module.
dependencies.add(npcsSourceSet.compileOnlyConfigurationName, customNpcsDependency)
// Geometry-framing tests use the module's client helper without loading Custom NPCs.
dependencies.add('testImplementation', npcsSourceSet.output)
