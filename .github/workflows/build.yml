name: Build

on:
  push:
    branches: ["master", "1.21.1", "26.1.2", "26.2"]
  pull_request:
    branches: ["master", "1.21.1", "26.1.2", "26.2"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-1_20_1:
    if: github.ref_name == 'master' || github.base_ref == 'master'
    name: Build 1.20.1
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew test --stacktrace --console=plain

      - name: Build with Gradle
        run: ./gradlew build -x test --stacktrace --console=plain

  build-1_21_1:
    if: github.ref_name == '1.21.1' || github.base_ref == '1.21.1'
    name: Build 1.21.1
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew test --stacktrace --console=plain

      - name: Build with Gradle
        run: ./gradlew build -x test --stacktrace --console=plain

  build-26_1_2:
    if: github.ref_name == '26.1.2' || github.base_ref == '26.1.2'
    name: Build 26.1.2
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew test --stacktrace --console=plain

      - name: Build all artifacts
        run: ./gradlew build packsJar officialPacksJar -x test --stacktrace --console=plain

  build-26_2:
    if: github.ref_name == '26.2' || github.base_ref == '26.2'
    name: Build 26.2
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew test --stacktrace --console=plain

      - name: Build all artifacts
        run: ./gradlew build packsJar officialPacksJar -x test --stacktrace --console=plain
